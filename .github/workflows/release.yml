# ============================================================================
#  Release —— 打 tag 自动测试并发布
#
#  一个仓库两个产品，用 tag 前缀区分：
#    desktop-v0.1.0  → 构建 Windows 安装版 + 便携版，上传到 GitHub Release
#    web-v0.7.0      → 创建 Release（源码快照由 GitHub 自动附带，正文取发布说明）
#
#  另外支持手动触发构建 macOS dmg（未签名，见 desktop/docs/BUILD_MAC.md）。
#  完整步骤见 docs/发布流程.md
# ============================================================================
name: Release

on:
  push:
    tags:
      - 'desktop-v*'   # 桌面版 js-pet
      - 'web-v*'       # 网页版 TidyLab
  workflow_dispatch:
    inputs:
      build_mac:
        description: '构建 macOS dmg（未签名，仅手动触发时生效）'
        type: boolean
        default: false
      mac_version:
        description: 'macOS 包归属的桌面版版本号（如填 0.1.0 则发到 desktop-v0.1.0；留空则只传工作流附件）'
        type: string
        default: ''

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 发布前置：两套产品的测试都通过才允许发布
  # ------------------------------------------------------------------
  test:
    name: 测试（网页版 + 桌面版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'   # 必须 >= 22.13：node:sqlite 在 22.13 前需 --experimental-sqlite 标志

      - name: 环境自检（Node 版本 / node:sqlite 可用性）
        run: |
          node -v
          npm -v
          node -e "require('node:sqlite'); console.log('node:sqlite 可用')"

      - name: 网页版 · 安装依赖
        run: |
          set +e
          npm ci 2>&1 | tee /tmp/web-ci.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            { echo "## ❌ 网页版依赖安装失败"; echo '```'; tail -30 /tmp/web-ci.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: 网页版 · 运行测试（66 项）
        run: |
          set +e
          npm test 2>&1 | tee /tmp/web-test.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## ❌ 网页版测试失败"
              echo '```'
              grep -aE "^not ok|^# (tests|pass|fail)|Error|Cannot find module|Timeout|服务未能" /tmp/web-test.log | head -25
              echo "--- 输出末尾 ---"
              tail -35 /tmp/web-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: 桌面版 · 安装依赖
        working-directory: desktop
        run: |
          set +e
          npm ci 2>&1 | tee /tmp/desk-ci.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            { echo "## ❌ 桌面版依赖安装失败"; echo '```'; tail -30 /tmp/desk-ci.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: 桌面版 · 运行测试（117 项）
        working-directory: desktop
        run: |
          set +e
          npm test 2>&1 | tee /tmp/desk-test.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## ❌ 桌面版测试失败"
              echo '```'
              grep -aE "^not ok|^# (tests|pass|fail)|Error|Cannot find module|Timeout" /tmp/desk-test.log | head -25
              echo "--- 输出末尾 ---"
              tail -35 /tmp/desk-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

  # ------------------------------------------------------------------
  # 桌面版：构建 Windows 安装版 + 便携版并发布
  # ------------------------------------------------------------------
  release-desktop:
    name: 发布桌面版（Windows 安装包）
    needs: test
    if: startsWith(github.ref_name, 'desktop-v')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'   # 必须 >= 22.13：node:sqlite 在 22.13 前需 --experimental-sqlite 标志

      - name: 安装依赖
        run: npm ci

      - name: 构建（NSIS 安装版 + portable 便携版）
        run: npm run build:win

      - name: 列出构建产物
        run: dir dist

      # 产物为 desktop/dist/js-pet-<版本>-setup.exe 与 -portable.exe
      - name: 创建 Release 并上传安装包
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --title "js-pet ${TAG#desktop-}" \
            --generate-notes \
            desktop/dist/*.exe

  # ------------------------------------------------------------------
  # 网页版：创建 Release（源码快照 GitHub 自动附带）
  # ------------------------------------------------------------------
  release-web:
    name: 发布网页版
    needs: test
    if: startsWith(github.ref_name, 'web-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#web-}"
          NOTES="docs/发布说明_${VER}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "TidyLab 网页版 $VER" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "TidyLab 网页版 $VER" --generate-notes
          fi

  # ------------------------------------------------------------------
  # macOS dmg（手动触发；未签名，首次打开需右键放行）
  # 说明：Windows 环境无法构建 mac 包，这里用 macOS runner 代劳。
  # ------------------------------------------------------------------
  build-mac:
    name: 构建 macOS dmg（手动，未签名）
    if: github.event_name == 'workflow_dispatch' && inputs.build_mac
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'   # 必须 >= 22.13：node:sqlite 在 22.13 前需 --experimental-sqlite 标志

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 构建 dmg（x64 + arm64）
        run: npm run build:mac

      - name: 上传构建产物（工作流附件，保底可取）
        uses: actions/upload-artifact@v4
        with:
          name: js-pet-macos-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error

      # 填了 mac_version 才把 dmg 直接并入对应版本的 Release，
      # 这样 Windows / macOS 安装包在同一个下载页就能取齐。
      - name: 发布 dmg 到 Release
        if: inputs.mac_version != ''
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-v${{ inputs.mac_version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" desktop/dist/*.dmg --clobber
            echo "已追加 dmg 到现有 Release：$TAG"
          else
            gh release create "$TAG" \
              --title "js-pet ${{ inputs.mac_version }}" \
              --generate-notes \
              desktop/dist/*.dmg
            echo "已创建 Release 并上传 dmg：$TAG"
          fi
